name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linter
        run: python -m pip install --upgrade pip flake8

      - name: Run Linter
        run: flake8 server/djangoapp server/djangoproj --count --select=E9,F63,F7,F82 --show-source --statistics

  javascript-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install

      - name: Run Linter
        working-directory: server/frontend
        run: npx eslint src --ext .js,.jsx
